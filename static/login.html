<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <title>Korda CRM | Вход</title>
    <link rel="stylesheet" href="style.css?v=127">
</head>
<body>
    <div id="authView" class="auth-wrapper">
        <div class="auth-card" id="loginFormCard">
            <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary);">KORDA CRM</h2>
            <div id="loginError" style="color: var(--danger); font-size: 13px; margin-bottom: 10px; text-align: center;"></div>
            <label class="form-field" style="display:block; margin-bottom:10px;">
          <span class="form-label">Логин или эл. почта</span>
                <input type="text" id="loginEmail" placeholder="Admin или user@пример.рф" class="auth-input" autocomplete="username">
            </label>
            <label class="form-field" style="display:block; margin-bottom:10px;">
                <span class="form-label">Пароль</span>
                <input type="password" id="loginPassword" placeholder="Введите пароль" class="auth-input" autocomplete="current-password">
            </label>
            <label class="form-field" style="display:none; margin-bottom:10px;" id="loginOtpWrap">
          <span class="form-label">Код двухфакторной защиты</span>
                <input type="text" id="loginOtpCode" placeholder="6-значный код" class="auth-input">
            </label>
            <div id="loginOtpHint" style="display:none; color: var(--secondary); font-size: 12px; margin:-4px 0 10px; text-align:center;">Открой приложение-аутентификатор и введи 6-значный код.</div>
            <button class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="login()">Войти</button>
        <div class="workflow-empty-note" style="margin-top:12px; text-align:center;">Нажми клавишу ввода, чтобы войти.</div>
            <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--secondary);">
                <a href="register.html" style="color: var(--secondary); text-decoration: none;">Запросить доступ</a> | 
                <span style="cursor:pointer;" onclick="document.getElementById('loginFormCard').style.display='none'; document.getElementById('recoverFormCard').style.display='block';">Забыли пароль?</span>
            </div>
        </div>

        <div class="auth-card" id="recoverFormCard" style="display: none;">
            <h2 style="text-align: center; margin-bottom: 20px;">Сброс пароля</h2>
          <input type="email" id="recEmail" placeholder="Ваша эл. почта" class="auth-input">
            <button class="btn-primary" style="width: 100%; justify-content: center; padding: 14px;" onclick="recoverPassword()">Сбросить</button>
            <div style="text-align: center; margin-top: 20px; font-size: 13px; cursor: pointer;" onclick="document.getElementById('recoverFormCard').style.display='none'; document.getElementById('loginFormCard').style.display='block';">Назад</div>
        </div>

        <div class="auth-card" id="pendingCard" style="display: none; text-align: center;">
            <h2>Ожидание доступа</h2>
            <p style="color: var(--secondary); font-size: 14px; margin-bottom: 24px;">Ваша запись ждет одобрения Директором.</p>
            <button class="btn-secondary" style="width: 100%; justify-content: center;" onclick="logout()">Сменить аккаунт</button>
        </div>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>
    
    <script src="app_api.js?v=5"></script>
    <script src="app_shell.js?v=5"></script>
    <script src="core.js?v=15"></script>
</body>
</html>
