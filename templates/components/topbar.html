<header class="topbar no-print krd-shell-topbar">
    <!-- Navigation and search -->
    <div class="krd-shell-topbar__lead">
        <button id="mobileMenuBtn" class="icon-btn mobile-menu-btn" type="button" onclick="const sidebar=document.querySelector('.sidebar'); if(sidebar) sidebar.scrollTop=0; document.body.classList.toggle('mobile-menu-open')" aria-label="Открыть меню">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
        </button>
        <span class="mobile-bar-title">KORDA CRM</span>
        <button id="topbarBackBtn" class="icon-btn topbar-back-btn krd-topbar-back krd-is-hidden" type="button" onclick="if(typeof navigateBack === 'function') navigateBack()" aria-label="Назад">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>

        <div class="search-bar krd-topbar-search">
            <svg class="topbar-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Поиск по разделам, договорам, клиентам, письмам..." autocomplete="off" autocapitalize="off" spellcheck="false" oninput="if(typeof handleOmniSearch === 'function') handleOmniSearch()" onfocus="if(typeof openOmniSearchSuggestions === 'function') openOmniSearchSuggestions()" onkeydown="if(typeof handleOmniSearchKeydown === 'function') handleOmniSearchKeydown(event)" onblur="if(typeof handleOmniSearchBlur === 'function') handleOmniSearchBlur()" class="topbar-search-input">
            <button id="commandPaletteHint" class="command-palette-hint" type="button" onclick="if(typeof openCommandPalette === 'function') openCommandPalette()" title="Командная палитра">⌘K</button>
            <div id="omniSearchResults" class="omni-search-results krd-is-hidden" aria-hidden="true"></div>
        </div>
    </div>

    <!-- Action bar -->
    <div class="topbar-actions krd-shell-topbar__actions">
        <div class="topbar-action-cluster" aria-label="Быстрые действия">
            <button id="topbarQuickTaskBtn" class="btn-secondary" onclick="if(typeof openCreateTaskModal === 'function') openCreateTaskModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                <span id="topbarQuickTaskLabel">Поручение</span>
            </button>

            <div id="topbarTaskControl" class="topbar-task-control krd-is-hidden" onclick="if(typeof navigateTo === 'function') navigateTo('tasks')">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Таймер
            </div>

            <button id="topbarQuickScanBtn" class="btn-secondary" onclick="if(typeof openScanner === 'function') openScanner()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M7 7h.01"></path><path d="M17 7h.01"></path><path d="M7 17h.01"></path><path d="M17 17h.01"></path></svg>
                <span id="topbarQuickScanLabel">QR</span>
            </button>

            <button id="topbarWorkspaceBtn" class="btn-secondary" onclick="if(typeof openWorkspaceConfigModal === 'function') openWorkspaceConfigModal()" title="Настроить интерфейс">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                <span>Конфиг</span>
            </button>
        </div>

        <div class="topbar-account-cluster" aria-label="Уведомления и профиль">
            <div class="notif-wrapper krd-topbar-notif">
                <button class="icon-btn notif-bell" id="notifBellBtn" onclick="if(typeof toggleNotifications === 'function') toggleNotifications()" title="Уведомления" aria-expanded="false" aria-controls="notifDropdown" type="button">
                    <span class="notif-bell-icon" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </span>
                    <span class="notif-badge krd-is-hidden" id="notifBadge">0</span>
                    <span class="notif-bell-meta">
                        <span class="notif-bell-state" id="notifBellState">Нет новых</span>
                        <span class="notif-bell-caret" aria-hidden="true"></span>
                    </span>
                </button>

                <div class="notif-dropdown krd-notif-dropdown krd-is-hidden" id="notifDropdown">
                    <div class="notif-header krd-notif-dropdown__head">
                        <div class="krd-notif-dropdown__heading">
                            <span class="krd-notif-dropdown__title">Уведомления</span>
                            <span class="krd-notif-dropdown__meta" id="notifMetaLabel">Нет новых событий</span>
                        </div>
                        <div class="krd-notif-dropdown__controls">
                            <button class="btn-secondary krd-notif-dropdown__action" onclick="if(typeof markAllNotificationsRead === 'function') markAllNotificationsRead()">Прочитано</button>
                            <button class="krd-notif-dropdown__close" type="button" onclick="if(typeof toggleNotifications === 'function') toggleNotifications(true, false)" aria-label="Закрыть уведомления">×</button>
                        </div>
                    </div>
                    <div class="notif-list" id="notifList">
                        <div class="krd-notif-dropdown__empty">Нет новых уведомлений</div>
                    </div>
                </div>
            </div>

            <div class="user-profile krd-topbar-user" onclick="if(typeof navigateTo === 'function') navigateTo('profile')">
                <div class="topbar-user-meta">
                    <span id="topbarUserName" class="krd-topbar-user__name">Загрузка...</span>
                </div>
                <div id="topbarUserInitials" class="topbar-user-avatar">?</div>
            </div>
        </div>
    </div>
</header>
