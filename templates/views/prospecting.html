<div id="prospectingView" class="view-page" style="display:none;">
    <div class="surface-card surface-card--padded crm-workspace-shell outreach-pool-page">
        <div class="view-header">
            <div class="view-heading">
                <span class="view-eyebrow">Общая очередь</span>
                <h1 class="view-title">База развития</h1>
                <p class="view-subtitle">Здесь находятся только свободные клиенты. Заберите подходящего клиента — после этого он исчезнет у других менеджеров и появится в разделе «Мои клиенты».</p>
            </div>
            <div class="view-actions">
                <button id="outreachBitrixNavButton" class="btn-secondary" type="button" onclick="navigateTo('bitrixImport')">Выгрузить из Bitrix24</button>
                <button class="btn-primary" type="button" onclick="navigateTo('myProspecting')">Мои клиенты</button>
            </div>
        </div>

        <div id="outreachPoolSummary" class="crm-summary-strip"></div>

        <section class="outreach-pool-toolbar" aria-label="Поиск свободных клиентов">
            <div class="outreach-pool-toolbar__search">
                <input id="outreachPoolSearch" class="auth-input" type="search" placeholder="Компания, контакт или реквизиты" aria-label="Поиск свободных клиентов" oninput="setOutreachPoolSearch(this.value)">
            </div>
            <button class="btn-secondary" type="button" onclick="refreshOutreachPool(true)">Обновить</button>
        </section>

        <div id="outreachPoolMount"></div>
    </div>
</div>
