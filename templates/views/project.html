<div id="projectView" style="display: none; padding: 20px; max-width: 1400px; margin: 0 auto;">
    
    <style>
        /* БРОНЕБОЙНАЯ СЕТКА ПАСПОРТА */
        .passport-perfect-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            align-items: start;
        }
        .static-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* 1. Жестко прибиваем 4 инпута в квадрат 2х2 слева (колонки 1 и 2) */
        .pos-name     { grid-column: 1 / 2; grid-row: 1; }
        .pos-contract { grid-column: 2 / 3; grid-row: 1; }
        .pos-client   { grid-column: 1 / 2; grid-row: 2; }
        .pos-manager  { grid-column: 2 / 3; grid-row: 2; }
        
        /* 2. ВСЁ ОСТАЛЬНОЕ (Свойства от JS и Доступ) жестко выкидываем вправо (колонки 3 и 4) */
        .passport-perfect-grid > div:not(.static-field) {
            grid-column: 3 / 5 !important;
            width: 100%;
        }
        
        /* Для маленьких экранов выстраиваем в одну линию */
        @media (max-width: 900px) {
            .passport-perfect-grid { display: flex; flex-direction: column; }
            .passport-perfect-grid > div { width: 100% !important; }
        }
    </style>

    <div style="margin-bottom: 24px;" class="no-print">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; background: var(--card-bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border); align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
            
            <button class="btn-secondary" onclick="navigateTo('dashboard')" style="border-radius: 8px; padding: 6px 14px; display: flex; align-items: center; gap: 6px; font-weight: 600;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Назад
            </button>

            <div style="width: 1px; height: 24px; background: var(--border); margin: 0 4px;"></div>

            <button class="btn-secondary" id="btnToggleChat" onclick="toggleChat()" style="border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg> Чат
            </button>
            <button class="btn-secondary" id="btnLogs" style="display: none; border-radius: 8px; padding: 6px 12px; align-items: center; gap: 6px;" onclick="openLogsModal()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg> Логи
            </button>
            <button class="btn-success" id="btnRestore" style="display: none; border-radius: 8px; padding: 6px 12px; align-items: center; gap: 6px;" onclick="restoreProject()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg> Восстановить
            </button>
            <button class="btn-danger" id="btnCancel" onclick="cancelProject()" style="border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg> Отменить
            </button>
            <button class="btn-primary" onclick="saveProjectInfo()" style="border-radius: 8px; padding: 6px 16px; display: flex; align-items: center; gap: 6px; font-weight: 600;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Сохранить
            </button>
            <button class="btn-secondary" onclick="downloadPDF()" style="border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg> PDF Отчет
            </button>
        </div>
    </div>

    <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
        
        <div class="passport-perfect-grid">
            
            <div class="static-field pos-name">
                <label style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Наименование</label>
                <input type="text" id="projName" class="auth-input" style="margin: 0; background: var(--bg); border-radius: 8px;">
            </div>
            
            <div class="static-field pos-contract">
                <label style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Договор №</label>
                <input type="text" id="projContract" class="auth-input" style="margin: 0; background: var(--bg); border-radius: 8px;">
            </div>
            
            <div class="static-field pos-client">
                <label style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Заказчик</label>
                <input type="text" id="projClient" class="auth-input" style="margin: 0; background: var(--bg); border-radius: 8px;">
            </div>
            
            <div class="static-field pos-manager">
                <label style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Менеджер</label>
                <input type="text" id="projManager" class="auth-input" style="margin: 0; background: var(--bg); border-radius: 8px;">
            </div>

            <div id="editProjRoles"></div>

            </div>
    </div>

    <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 24px;">
            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px;">
                <label style="font-weight: 700; color: var(--secondary); font-size: 11px; text-transform: uppercase;">Сумма договора (₽)</label>
                <input type="number" id="projBudget" class="auth-input" onchange="calcMargin()" onkeyup="calcMargin()" style="margin:0; font-weight: bold; font-size: 18px; border: 2px solid var(--success); background: #fff; padding: 12px; border-radius: 8px;">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 150px;">
                <label style="font-weight: 700; color: var(--secondary); font-size: 11px; text-transform: uppercase;">Себестоимость (₽)</label>
                <input type="number" id="projCosts" class="auth-input" readonly style="margin:0; font-weight: bold; font-size: 18px; background: rgba(239, 68, 68, 0.05); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px; border-radius: 8px;" title="Считается автоматически">
            </div>
            
            <div style="width: 1px; height: 50px; background: var(--border); display: block;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 120px;">
                <label style="font-weight: 700; color: var(--secondary); font-size: 11px; text-transform: uppercase;">Трудозатраты</label>
                <div id="projLaborCosts" style="font-size: 18px; font-weight: 800; color: var(--text);">0 ₽</div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 120px;">
                <label style="font-weight: 700; color: var(--secondary); font-size: 11px; text-transform: uppercase;">Смета материалов</label>
                <div id="projMaterialCosts" style="font-size: 18px; font-weight: 800; color: var(--text);">0 ₽</div>
            </div>
            
            <div style="width: 1px; height: 50px; background: var(--border); display: block;"></div>
            
            <div style="display: flex; flex-direction: column; gap: 8px; flex: 1.5; min-width: 180px; align-items: flex-end;">
                <label style="font-weight: 700; color: var(--secondary); font-size: 11px; text-transform: uppercase;">Чистая маржа</label>
                <div id="projMargin" style="font-size: 24px; font-weight: 800; color: var(--success);">0 ₽ (0%)</div>
            </div>
        </div>
    </div>

    <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
        <label style="font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Рабочая группа (Доступ)
        </label>
        <div id="projTeam" style="padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); max-height: 250px; overflow-y: auto; font-size: 13px; line-height: 1.6;"></div>
    </div>

    <div id="projNomenclatureBlock" style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);">
            <div>
                <h3 style="margin: 0; font-size: 16px; color: var(--text); display: flex; align-items: center; gap: 8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    Спецификация проекта
                </h3>
                <p style="margin: 4px 0 0 0; font-size: 13px; color: var(--secondary);">Материалы и оборудование из базы НСИ</p>
            </div>
            <button class="btn-primary no-print" style="padding: 8px 16px; font-size: 13px; border-radius: 8px; font-weight: 600;" onclick="openAddNomToProjectModal()">+ Добавить позицию</button>
        </div>
        <div id="projNomenclatureTable"></div>
    </div>
        
    <div style="background: var(--card-bg); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);" class="no-print">
        <label style="color:var(--secondary); font-size:12px; font-weight:700; text-transform: uppercase; display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            Файлы проекта
        </label>
        
        <div id="projectFilesList" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;"></div>
        
        <div style="display: flex; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 1px dashed var(--border);">
            <input type="file" id="fileUploadInput" style="display:none" onchange="uploadFile(event)">
            <button class="btn-secondary" style="border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-weight: 500;" onclick="document.getElementById('fileUploadInput').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> 
                Загрузить файл
            </button>
            <button class="btn-primary" style="border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-weight: 600;" onclick="generateContractDoc()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M9 15l2 2 4-4"></path></svg> 
                Сгенерировать договор
            </button>
            <button class="btn-secondary" style="border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 8px; font-weight: 500;" onclick="request1CInvoice()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Выставить счет (1С)
            </button>
        </div>
    </div>

    <div class="progress-container no-print" style="margin-bottom: 24px; border-radius: 12px; overflow: hidden;"><div class="progress-bar" id="progressBar"></div></div>

    <div class="project-grid-layout" id="projectGrid">
        <div>
            <div id="ganttContainer" class="no-print" style="margin-bottom: 24px;"></div>

            <div id="checklist"></div>
            
            <div class="final-block" id="finalBlock">
                <div class="final-message">СДЕЛКА УСПЕШНО ЗАКРЫТА</div>
                <div style="margin-top: 20px; background: rgba(0,0,0,0.03); padding: 20px; border-radius: 12px; text-align: left;">
                    <label style="font-size: 12px; font-weight: bold; color: var(--secondary);">ДАННЫЕ ФИЗИЧЕСКОГО АРХИВА:</label>
                    <div style="display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap;">
                        <input type="text" id="arcFolder" class="auth-input" style="margin:0; border-radius: 8px; flex: 1; min-width: 120px;" placeholder="№ Папки">
                        <input type="text" id="arcRack" class="auth-input" style="margin:0; border-radius: 8px; flex: 1; min-width: 120px;" placeholder="Стеллаж">
                        <input type="text" id="arcDate" class="date-picker auth-input" style="margin:0; border-radius: 8px; flex: 1; min-width: 120px;" placeholder="Дата">
                    </div>
                </div>
                <button class="btn-primary no-print" id="btnArchiveFinal" style="margin-top: 20px; width: 100%; justify-content: center; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 14px;" onclick="archiveCurrentProject()">Передать в Архив</button>
            </div>
        </div>
        
        <div class="chat-container no-print" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02);">
            <div class="chat-header" style="background: var(--primary); color: white; padding: 16px 20px; font-weight: 600;">Единая лента (Чат и Документы)</div>
            <div class="chat-messages" id="chatMessages" style="padding: 20px;"></div>
            <div class="chat-input-area" style="padding: 16px 20px; border-top: 1px solid var(--border); background: var(--bg);">
                <input type="text" id="chatInput" style="margin:0; border-radius: 24px; padding: 12px 20px; border: 1px solid var(--border); flex:1; background: #fff;" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button class="btn-icon-send" onclick="sendChatMessage()" style="background: var(--primary); color: white; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: 12px; transition: 0.2s;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
            </div>
        </div>
    </div>
</div>

<div id="fileHistoryModal" class="modal-overlay" style="display: none; z-index: 10000;">
    <div class="modal-card" style="max-width: 500px; padding: 24px; border-radius: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="margin: 0; font-size: 18px; color: var(--primary);">История версий файла</h2>
            <button class="btn-danger" style="padding: 6px 10px; font-size: 12px; border-radius: 6px;" onclick="document.getElementById('fileHistoryModal').style.display='none'">✕</button>
        </div>
        <div id="fileHistoryList" style="display: flex; flex-direction: column; max-height: 400px; overflow-y: auto; padding-right: 5px;"></div>
    </div>
</div>
