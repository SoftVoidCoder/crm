<div id="dashboardView">
    <div class="dashboard-toolbar">
        <h1 id="dashboardTitle" class="dashboard-title">ВСЕ ПРОЕКТЫ</h1>
        <div class="dashboard-actions">
            <button class="btn-secondary" onclick="exportToExcel()">↓ EXCEL</button>
            <button class="btn-primary" onclick="createNewProject()">+ Создать проект</button>
        </div>
    </div>
    <div class="dashboard-subbar">
        <div class="tabs" style="border: none; padding: 0;">
            <button class="tab active" onclick="switchTab('active')">В работе</button>
            <button class="tab" onclick="switchTab('archive')">Архив</button>
            <button class="tab" onclick="switchTab('canceled')">Отмененные</button>
        </div>
        <div class="view-switcher">
            <button id="viewListBtn" class="btn-secondary view-switch-btn" style="background: var(--card-bg); color: var(--text);" onclick="setViewMode('list')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg> Список
            </button>
            <button id="viewKanbanBtn" class="btn-secondary view-switch-btn" onclick="setViewMode('kanban')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg> Доска
            </button>
            <button id="viewTimelineBtn" class="btn-secondary view-switch-btn" onclick="setViewMode('timeline')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> Таймлайн
            </button>
        </div>
    </div>
    <div class="projects-grid" id="projectsList"></div>
    <div class="kanban-board" id="kanbanBoard" style="display: none;"></div>
    <div class="timeline-board" id="timelineBoard" style="display: none;"></div>
</div>
