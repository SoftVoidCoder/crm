<div id="dashboardView" class="view-page crm-page-shell projects-workspace">
    <div id="dashboardFirstRunMount" class="krd-is-hidden"></div>
    <div id="dashboardHeroMount" class="dashboard-hero-shell"></div>

    <section class="projects-registry-card">
        <div class="projects-registry-head">
            <div>
                <h1 id="dashboardTitle" class="projects-registry-title">Все проекты</h1>
                <p class="projects-registry-subtitle">Откройте проект, чтобы увидеть карточку, состав, документы и ход работы.</p>
            </div>
            <div class="projects-registry-actions">
                <details class="projects-more-menu">
                    <summary class="btn-secondary">Дополнительно</summary>
                    <div class="projects-more-menu__panel">
                        <button type="button" onclick="exportToExcel()">Выгрузить в Excel</button>
                        <button type="button" onclick="openTenderImportModal()">Создать из тендера</button>
                    </div>
                </details>
                <button class="btn-primary" onclick="createNewProject()">Создать проект</button>
            </div>
        </div>

        <div class="projects-registry-search">
            <span aria-hidden="true">⌕</span>
            <input id="projectRegistrySearch" type="search" placeholder="Найти проект, заказчика, договор или ответственного" oninput="renderDashboard()">
            <button type="button" onclick="document.getElementById('projectRegistrySearch').value=''; renderDashboard()">Сбросить</button>
        </div>

        <div class="projects-registry-controls">
            <div class="tabs projects-status-tabs">
                <button class="tab active" onclick="switchTab('active')">В работе</button>
                <button class="tab" onclick="switchTab('archive')">Завершённые</button>
                <button class="tab" onclick="switchTab('canceled')">Отменённые</button>
            </div>
            <div class="view-switcher projects-view-switcher">
                <button id="viewListBtn" class="btn-secondary view-switch-btn" onclick="setViewMode('list')">Список</button>
                <button id="viewKanbanBtn" class="btn-secondary view-switch-btn" onclick="setViewMode('kanban')">По этапам</button>
                <button id="viewTimelineBtn" class="krd-is-hidden" onclick="setViewMode('timeline')">Таймлайн</button>
            </div>
        </div>

        <div class="projects-grid projects-registry-list" id="projectsList"></div>
        <div class="kanban-board projects-registry-board" id="kanbanBoard" style="display: none;"></div>
        <div class="timeline-board" id="timelineBoard" style="display: none;"></div>
    </section>
</div>
