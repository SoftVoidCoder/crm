<div id="tasksView" class="view-page task-center-page" style="display: none;">
    <div class="view-header task-center-header">
        <div class="view-heading">
            <span class="view-eyebrow">Рабочие поручения</span>
            <h1 class="view-title">Поручения</h1>
            <p class="view-subtitle">Один простой список: что нужно сделать, кто отвечает, какой срок и что уже выполнено.</p>
        </div>
        <div class="view-actions task-center-header__actions">
            <button class="btn-primary" onclick="openCreateTaskModal()">+ Дать поручение</button>
        </div>
    </div>

    <div id="taskCenterCounters" class="task-center-counters"></div>

    <div class="surface-card task-center-shell">
        <div class="task-center-toolbar">
            <div class="task-center-search">
                <input id="taskCenterSearch" type="text" class="auth-input" placeholder="Поиск по задаче, описанию, проекту, исполнителю" oninput="taskCenterHandleSearch(this.value)">
            </div>
            <div class="task-center-toolbar__filters">
                <select id="taskCenterStatusFilter" class="auth-input" onchange="taskCenterSetFilter('statusScope', this.value)">
                    <option value="all">Все статусы</option>
                    <option value="active">Активные</option>
                    <option value="completed">Выполнено</option>
                    <option value="overdue">Просрочено</option>
                    <option value="mine">Назначено мне</option>
                    <option value="delegated">Назначено мной</option>
                </select>
                <select id="taskCenterPriorityFilter" class="auth-input" onchange="taskCenterSetFilter('priority', this.value)">
                    <option value="all">Все приоритеты</option>
                    <option value="high">Высокий</option>
                    <option value="normal">Нормальный</option>
                </select>
            </div>
        </div>

        <div id="taskCenterBulkBar" class="task-center-bulkbar" style="display:none;"></div>

        <div class="task-center-layout">
            <div class="task-center-main">
                <div id="taskCenterViewMount"></div>
            </div>
            <aside class="task-center-side">
                <div class="task-center-side__card">
                    <div class="task-center-side__head">
                        <div>
                            <div class="task-center-side__eyebrow">Детали</div>
                            <div id="taskDetailTitle" class="task-center-side__title">Выбери задачу</div>
                        </div>
                    </div>
                    <div id="taskDetailBody" class="task-center-side__body">
                        <div class="task-center-empty">Открой строку в реестре, чтобы увидеть историю, комментарии и быстрые действия.</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</div>
