<div id="dealsView" class="view-page" style="display:none;">
    <div class="surface-card surface-card--padded crm-workspace-shell">
        <div class="view-header">
            <div class="view-heading">
                <span class="view-eyebrow">Работа после согласия клиента</span>
                <h1 class="view-title">Сделки</h1>
                <p class="view-subtitle">Контролируйте этап, следующий шаг, деньги, документы и историю общения в одной карточке.</p>
            </div>
            <div class="view-actions">
                <button class="btn-primary" onclick="openDealEditor()">Добавить сделку</button>
            </div>
        </div>

        <div class="crm-toolbar deal-simple-toolbar">
            <input id="dealSearchInput" class="auth-input" type="search" placeholder="Найти сделку или клиента" oninput="applyDealSearch(this.value)">
            <div class="deal-simple-toolbar__stages">
                <select id="dealStageFilter" class="auth-input" onchange="setDealStageFilter(this.value)">
                    <option value="">Все этапы</option>
                    <option value="qualification">Уточняем заказ</option>
                    <option value="proposal">Готовим документы и счёт</option>
                    <option value="negotiation">Согласовываем условия</option>
                    <option value="won">Успешно завершено</option>
                    <option value="lost">Закрыто без продажи</option>
                </select>
                <button id="dealArchiveToggle" class="btn-secondary" type="button" onclick="toggleDealArchiveView()">Архив</button>
            </div>
        </div>

        <div id="dealsContentMount"></div>
    </div>
</div>
