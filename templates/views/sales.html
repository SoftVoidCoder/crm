<div id="salesView" class="view-page" style="display:none;">
    <div class="surface-card surface-card--padded sales-archive-shell">
        <div class="view-header">
            <div class="view-heading">
                <span class="view-eyebrow">Документы по расчётам</span>
                <h1 class="view-title">Счета и акты</h1>
                <p class="view-subtitle">Готовые счета, акты / УПД и накладные из раздела «Документы компании».</p>
            </div>
            <div class="view-actions">
                <button class="btn-secondary" type="button" onclick="navigateTo('documents')">Открыть Документы компании</button>
            </div>
        </div>

        <div class="sales-archive-note">
            <div>
                <strong>Здесь документы только просматривают</strong>
                <span>Создание, загрузка файлов и изменение данных выполняются в разделе «Документы компании».</span>
            </div>
        </div>

        <div id="salesArchiveTabs" class="sales-archive-tabs" aria-label="Виды документов"></div>

        <div class="sales-archive-toolbar">
            <label>
                <span>Поиск</span>
                <input id="salesArchiveSearch" class="auth-input" type="search" placeholder="Номер, клиент или название документа" oninput="setSalesArchiveSearch(this.value)">
            </label>
            <button class="btn-secondary" type="button" onclick="resetSalesArchiveSearch()">Сбросить</button>
        </div>

        <div id="salesArchiveList" class="sales-archive-list"></div>
    </div>
</div>
