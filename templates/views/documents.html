<div id="documentsView" class="view-page cr-page" style="display:none;">
    <header class="cr-header">
        <div class="cr-header-main">
            <h1 class="cr-title">Документы компании</h1>
        </div>
        <div class="cr-header-actions">
            <button class="btn-primary" type="button" onclick="openDocumentModalWithPreset({ type: dcState.journal === 'outgoing' || dcState.journal === 'internal' ? dcState.journal : 'incoming' })">+ Добавить документ</button>
        </div>
    </header>

    <div class="cr-layout">
        <aside class="cr-folders surface-card">
            <div class="cr-folders-head"><strong>Журналы</strong></div>
            <ul id="dcJournalList" class="cr-folder-list"></ul>
        </aside>

        <section class="cr-registry surface-card">
            <div class="cr-toolbar">
                <div class="cr-toolbar-group">
                    <button class="btn-secondary" type="button" onclick="dcOpenSelected()">Просмотр</button>
                    <button class="btn-secondary" type="button" onclick="dcEditSelected()">Изменить</button>
                    <button class="btn-secondary" type="button" onclick="dcDownloadSelected()">Скачать файл</button>
                    <button class="btn-secondary" type="button" onclick="dcArchiveSelected()" id="dcArchiveBtn">В архив</button>
                    <button class="btn-secondary" type="button" onclick="dcDeleteSelected()">Удалить</button>
                    <span class="cr-menu">
                        <button class="btn-secondary" type="button" onclick="dcToggleExportMenu(event)">Выгрузки ▾</button>
                        <span class="cr-menu-list" id="dcExportMenu" hidden>
                            <button type="button" onclick="dcExport('xlsx')">Excel (.xlsx)</button>
                            <button type="button" onclick="dcExport('print')">Печать реестра</button>
                        </span>
                    </span>
                </div>
                <div class="cr-toolbar-group cr-toolbar-search">
                    <input id="dcSearch" class="cr-search" type="search" placeholder="Поиск: номер, тема, корреспондент, исполнитель…" oninput="dcRender()">
                </div>
            </div>
            <div class="cr-filterbar">
                <label><input type="radio" name="dcPeriod" value="all" checked onchange="dcSetPeriod(this.value)"> Все</label>
                <label><input type="radio" name="dcPeriod" value="year" onchange="dcSetPeriod(this.value)"> За последний год</label>
                <label><input type="radio" name="dcPeriod" value="range" onchange="dcSetPeriod(this.value)"> За период с</label>
                <input id="dcDateFrom" type="date" onchange="dcSetPeriod('range')"> по <input id="dcDateTo" type="date" onchange="dcSetPeriod('range')">
                <select id="dcStatusFilter" class="cr-status-filter" onchange="dcRender()">
                    <option value="">Все статусы</option>
                    <option value="draft">Черновик</option><option value="registered">Зарегистрирован</option>
                    <option value="signed">Подписан</option><option value="done">Выполнен</option><option value="archived">В архиве</option>
                </select>
                <span class="cr-legend">
                    <span><i class="cr-dot cr-dot--overdue"></i>срок прошёл</span>
                    <span><i class="cr-dot cr-dot--expiring"></i>срок через 3 дня и меньше</span>
                    <span><i class="cr-dot dc-dot--nofile"></i>нет файла</span>
                </span>
            </div>
            <div class="cr-table-wrap">
                <table class="cr-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" class="cr-keep" title="Отметить все" onchange="dcToggleAll(this.checked)"></th>
                            <th>№</th><th>Тип</th><th>Номер</th><th>Дата</th><th>Тема</th><th>Корреспондент</th>
                            <th>Исполнитель</th><th>Срок</th><th>Статус</th><th>Файл</th>
                        </tr>
                        <tr id="dcFilterRow" class="cr-filter-row"></tr>
                    </thead>
                    <tbody id="dcTableBody"></tbody>
                </table>
            </div>
            <div id="dcFooter" class="cr-footer"></div>
            <p class="cr-hint">Щелчок — выделить строку, двойной щелчок — карточка документа. Галочками можно отметить несколько документов для архива, удаления или выгрузки.</p>
        </section>
    </div>
</div>
