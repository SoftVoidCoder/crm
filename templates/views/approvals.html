<div id="approvalsView" class="view-page" style="display:none;">
    <div class="surface-card surface-card--padded approvals-simple-shell">
        <header class="view-header approvals-simple-header">
            <div class="view-heading">
                <span class="view-eyebrow">Очередь решений</span>
                <h1 class="view-title">Согласования</h1>
                <p class="view-subtitle">Откройте документ, проверьте его и выберите одно понятное решение.</p>
            </div>
            <div class="view-actions">
                <button class="btn-primary" type="button" onclick="openCreateApprovalModal()">+ Новое согласование</button>
            </div>
        </header>

        <div id="approvalsSimpleMetrics" class="approvals-simple-metrics"></div>

        <div class="approvals-simple-toolbar">
            <nav class="krd-segment" role="tablist" aria-label="Состояние согласований">
                <button class="krd-tab krd-segment__btn active" id="tabApprPending" type="button" role="tab" aria-selected="true" onclick="switchApprTab('pending')">Требуют решения</button>
                <button class="krd-tab krd-segment__btn" id="tabApprCompleted" type="button" role="tab" aria-selected="false" onclick="switchApprTab('completed')">Завершённые</button>
            </nav>
            <input id="approvalsSimpleSearch" class="auth-input" type="search" placeholder="Найти документ, автора или согласующего" oninput="setApprovalSimpleSearch(this.value)">
        </div>

        <div class="approvals-simple-help">
            <span>1. Откройте документ</span><span>2. Проверьте содержание</span><span>3. Согласуйте или верните с причиной</span>
        </div>

        <div id="approvalsListContainer" class="approvals-simple-list" aria-live="polite"></div>
    </div>
</div>
