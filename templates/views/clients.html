<div id="clientsView" style="display: none;">
    <div style="background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); padding: 32px;">
        <h2 style="margin-bottom: 24px;">База Контрагентов</h2>
        <div class="client-form">
            <div><label>Название (ООО/ИП)</label><input type="text" id="addClientName" class="auth-input" style="margin:0;"></div>
            <div><label>ИНН</label><input type="text" id="addClientInn" class="auth-input" style="margin:0;"></div>
            <div><label>Контакты (Тел/Email)</label><input type="text" id="addClientContact" class="auth-input" style="margin:0;"></div>
            <button class="btn-primary" style="height: 46px;" onclick="addClient()">+ Добавить</button>
        </div>
        <table class="admin-table">
            <thead><tr><th>Название</th><th>ИНН</th><th>Контакты</th></tr></thead>
            <tbody id="clientsListTable"></tbody>
        </table>
    </div>
</div>
