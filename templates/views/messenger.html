<div id="messengerView" style="display: none; height: calc(100vh - 120px);">
    <div style="display: flex; height: 100%; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden;">
        <div style="width: 280px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg);">
            <div style="padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 16px;">Чаты</h3>
                <button class="btn-secondary" style="padding: 4px 8px; font-size: 12px; border-radius: 8px;" onclick="openCreateChatModal()">+ Чат</button>
            </div>
            <div id="messengerChatsList" style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 4px;"></div>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; background: var(--card-bg);">
            <div id="messengerHeader" style="padding: 16px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center;">
                <span id="mChatTitle">Выберите чат слева</span>
                <button id="btnDeleteChat" class="btn-danger" style="display: none; padding: 4px 8px; font-size: 12px; border-radius: 8px;" onclick="deleteCurrentChat()">Удалить чат</button>
            </div>
            <div id="messengerMessages" style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: rgba(15, 23, 42, 0.01);">
                <div style="text-align:center; color:var(--secondary); margin-top:50px;">Здесь пока пусто. Выберите чат или создайте новый.</div>
            </div>
            <div id="messengerInputArea" style="padding: 16px; border-top: 1px solid var(--border); display: none; gap: 10px; align-items: center; background: var(--card-bg);">
                <input type="text" id="messengerInput" style="flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg); outline: none; color: var(--text);" placeholder="Написать сообщение..." onkeypress="if(event.key === 'Enter') sendGlobalMessage()">
                <button class="btn-primary" style="border-radius: 50%; width: 42px; height: 42px; padding: 0; justify-content: center;" onclick="sendGlobalMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width: 18px; height: 18px; margin-left: -2px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</div>
