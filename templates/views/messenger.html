<div id="messengerView" class="view-page crm-page-shell crm-page-shell--chat" style="display: none;">
    <div class="view-header messenger-page-header">
        <div class="view-heading">
            <span class="view-eyebrow">Коммуникации</span>
            <h1 class="view-title">Корпоративный чат</h1>
            <p class="view-subtitle">Рабочие диалоги компании в одном месте.</p>
        </div>
        <div class="view-actions">
            <button class="btn-primary" type="button" onclick="openCreateChatModal()">+ Новый чат</button>
        </div>
    </div>

    <div class="surface-card messenger-workspace">
        <div id="messengerChatsPane" class="messenger-pane">
            <div class="crm-chat-shell">
                <aside class="crm-chat-sidebar">
                    <div class="crm-chat-sidebar-head">
                        <div>
                            <div class="section-title">Диалоги</div>
                            <div class="section-subtitle">Выберите общий чат, чат отдела или рабочую группу.</div>
                        </div>
                    </div>
                    <label class="messenger-search" for="messengerChatSearch">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
                        <input id="messengerChatSearch" type="search" placeholder="Найти чат" autocomplete="off" oninput="filterMessengerChats(this.value)">
                    </label>
                    <div id="messengerChatsList" class="crm-chat-list"></div>
                </aside>

                <section class="crm-chat-main" aria-label="Переписка">
                    <div id="messengerHeader" class="crm-chat-main-head">
                        <div class="messenger-conversation-title">
                            <span class="messenger-conversation-kicker">Переписка</span>
                            <span id="mChatTitle">Выберите чат</span>
                        </div>
                        <button id="btnDeleteChat" class="messenger-delete-chat" type="button" style="display: none;" onclick="deleteCurrentChat()">Удалить чат</button>
                    </div>
                    <div id="messengerMessages" class="crm-chat-messages">
                        <div class="crm-chat-empty-state">
                            <div>
                                <strong>Выберите диалог слева</strong>
                                <span>После этого здесь появится переписка.</span>
                            </div>
                        </div>
                    </div>
                    <div id="messengerInputArea" class="crm-chat-input" style="display: none;">
                        <input type="text" id="messengerInput" class="crm-chat-input-field" placeholder="Напишите сообщение" onkeypress="if(event.key === 'Enter') sendGlobalMessage()">
                        <button class="btn-primary crm-chat-send-btn" type="button" aria-label="Отправить сообщение" onclick="sendGlobalMessage()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            <span>Отправить</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>
</div>
