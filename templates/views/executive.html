<div id="executiveView" class="view-page" style="display:none;">
    <div class="surface-card surface-card--padded executive-simple-shell">
        <header class="view-header executive-simple-header">
            <div class="view-heading">
                <span class="view-eyebrow">Ежедневный контроль</span>
                <h1 class="view-title">Панель директора</h1>
                <p class="view-subtitle">Только вопросы, где требуется решение директора: деньги, сроки, согласования и исполнение.</p>
            </div>
            <div class="view-actions">
                <button class="btn-secondary" type="button" onclick="renderExecutiveDashboard()">Обновить</button>
            </div>
        </header>

        <section id="executiveSimpleDashboard" class="executive-simple-dashboard" aria-live="polite">
            <div id="executiveSimpleStatus" class="executive-simple-status"></div>
            <div id="executiveSimpleMetrics" class="executive-simple-metrics"></div>

            <div class="executive-simple-section-head">
                <div>
                    <h2>Требует решения</h2>
                    <p>Откройте источник проблемы, примите решение или назначьте поручение ответственному.</p>
                </div>
            </div>
            <div id="executiveSimpleQueue" class="executive-simple-queue"></div>
        </section>

        <section class="executive-simple-links">
            <div><strong>Быстрый переход</strong><span>Когда нужен полный рабочий раздел.</span></div>
            <nav aria-label="Основные разделы директора">
                <button class="btn-secondary" type="button" onclick="navigateTo('approvals')">Согласования</button>
                <button class="btn-secondary" type="button" onclick="navigateTo('finance')">Финансы</button>
                <button class="btn-secondary" type="button" onclick="navigateTo('dashboard')">Проекты</button>
                <button class="btn-secondary" type="button" onclick="navigateTo('production')">Производство</button>
            </nav>
        </section>
    </div>
</div>
