<div id="profileView" style="display: none;">
    <h2 style="margin-bottom: 24px; font-size: 22px;">ЛИЧНЫЙ КАБИНЕТ</h2>
    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-title">Задач выполнено</div>
            <div class="metric-value" id="profCompletedTasks">0</div>
        </div>
        <div class="metric-card warning">
            <div class="metric-title">Дедлайны на этой неделе</div>
            <div class="metric-value" id="profUpcomingDeadlines">0</div>
        </div>
    </div>
    
    <div style="background: var(--card-bg); padding: 32px; border-radius: 20px; border: 1px solid var(--border); margin-top: 24px;">
        <h3 style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            Электронная подпись (ЭЦП)
        </h3>
        <p style="font-size: 13px; color: var(--secondary); margin-bottom: 20px;">Нарисуйте вашу подпись мышкой или пальцем.</p>
        <canvas id="sigCanvas" width="400" height="150" style="border: 2px dashed var(--border); border-radius: 12px; background: var(--bg); cursor: crosshair; touch-action: none; max-width: 100%;"></canvas>
        <div style="margin-top: 16px; display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="clearSignature()">Очистить</button>
            <button class="btn-primary" onclick="saveSignature()">Сохранить подпись</button>
        </div>
    </div>
    
    <div style="background: var(--card-bg); padding: 32px; border-radius: 20px; border: 1px solid var(--border); margin-top: 24px;">
        <h3 style="margin-bottom: 10px; display: flex; align-items: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            Учет отсутствий и Делегирование
        </h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom: 10px;">
            <select id="absType" class="auth-input" style="width:160px; margin:0; cursor:pointer;">
                <option value="Отпуск">Отпуск</option>
                <option value="Больничный">Больничный</option>
                <option value="Командировка">Командировка</option>
                <option value="Другое">Другое</option>
            </select>
            <input type="text" id="absStart" class="date-picker auth-input" placeholder="Начало (С)" style="width:130px; margin:0;">
            <input type="text" id="absEnd" class="date-picker auth-input" placeholder="Конец (По)" style="width:130px; margin:0;">
            <select id="vacationDeputy" class="auth-input" style="width:200px; margin:0; cursor:pointer;"><option value="">Без заместителя</option></select>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input type="text" id="absReason" class="auth-input" placeholder="Причина..." style="flex:1; margin:0;">
            <button class="btn-primary" onclick="saveVacation()">Сохранить</button>
            <button class="btn-secondary" onclick="clearVacation()" style="color: var(--danger); border-color: var(--danger);">Сбросить</button>
        </div>
    </div>

    <div id="directorUsersBlock" style="display: none; background: var(--card-bg); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; padding: 24px; margin-top: 24px;">
        
        <h3 style="margin-top:0; margin-bottom:20px; display: flex; align-items: center; gap: 8px;">
            Управление сотрудниками (Всего: <span id="totalUsersCount">0</span>)
        </h3>

        <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px;">
            <button id="tabActiveUsers" class="tab active" onclick="switchUsersTab('active')" style="padding: 6px 12px; border:none; background:none; cursor:pointer; font-weight:bold;">Активные</button>
            <button id="tabBannedUsers" class="tab" onclick="switchUsersTab('banned')" style="padding: 6px 12px; border:none; background:none; cursor:pointer; font-weight:bold; color:var(--danger);">Заблокированные</button>
        </div>

        <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-secondary user-filter-btn active" onclick="filterUsersByRole('')">Все</button>
            <button class="btn-secondary user-filter-btn" onclick="filterUsersByRole('Менеджер')">Менеджеры</button>
            <button class="btn-secondary user-filter-btn" onclick="filterUsersByRole('Конструкторское бюро')">КБ</button>
            <button class="btn-secondary user-filter-btn" onclick="filterUsersByRole('Производство и ОТК')">Производство</button>
            <button class="btn-secondary user-filter-btn" onclick="filterUsersByRole('Бухгалтерия')">Бухгалтерия</button>
            <button class="btn-secondary user-filter-btn" onclick="filterUsersByRole('Юрист')">Юристы</button>
        </div>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Сотрудник</th>
                    <th>Логин (Email)</th>
                    <th>Пароль</th>
                    <th>Отдел / Роль</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="allUsersListTable"></tbody>
        </table>
    </div>
</div>
