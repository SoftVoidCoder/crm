<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project.name }} | Статус проекта</title>
    <style>
        :root {
            --bg: #f3f6f8;
            --card: #ffffff;
            --text: #172236;
            --muted: #6b7a90;
            --line: #dce4eb;
            --primary: #0f8276;
            --primary-soft: #e9f7f4;
            --success: #177245;
            --success-soft: #eaf7ef;
            --danger: #b42318;
            --danger-soft: #fff0ef;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            background: var(--bg);
            font-family: Inter, "Segoe UI", sans-serif;
        }
        .status-card {
            width: min(620px, 100%);
            padding: 30px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--card);
            box-shadow: 0 18px 44px rgba(15, 31, 48, .08);
        }
        .stage-label {
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .07em;
            text-transform: uppercase;
        }
        h1 {
            margin: 0;
            font-size: clamp(28px, 6vw, 42px);
            line-height: 1.15;
        }
        .stage-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 22px;
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--primary-soft);
            color: var(--primary);
            font-weight: 800;
        }
        .stage-status::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .stage-status.is-done { background: var(--success-soft); color: var(--success); }
        .stage-status.is-canceled { background: var(--danger-soft); color: var(--danger); }
        .stage-status.is-planned { background: #eef2f6; color: #65748a; }
        .timer-block {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }
        .timer-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
        }
        .timer-value {
            margin-top: 7px;
            color: var(--text);
            font-size: clamp(26px, 5vw, 36px);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: .04em;
        }
    </style>
</head>
<body>
    <main class="status-card">
        <div class="stage-label">Текущий этап проекта</div>
        <h1>{{ current_stage.title }}</h1>
        <div class="stage-status is-{{ current_stage.state }}">{{ current_stage.label }}</div>
        <div class="timer-block">
            <div class="timer-label">Время на этапе</div>
            <div id="stageElapsed" class="timer-value" data-seconds="{{ current_stage.elapsed_seconds or 0 }}" data-running="{{ '1' if current_stage.timer_running else '0' }}">00:00:00</div>
        </div>
    </main>
    <script>
        (() => {
            const timer = document.getElementById('stageElapsed');
            const baseSeconds = Number(timer.dataset.seconds || 0);
            const running = timer.dataset.running === '1';
            const openedAt = Date.now();
            const format = (value) => {
                const seconds = Math.max(0, Math.floor(value));
                const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
                const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                const rest = String(seconds % 60).padStart(2, '0');
                return `${hours}:${minutes}:${rest}`;
            };
            const render = () => {
                const liveSeconds = running ? baseSeconds + (Date.now() - openedAt) / 1000 : baseSeconds;
                timer.textContent = format(liveSeconds);
            };
            render();
            if (running) setInterval(render, 1000);
        })();
    </script>
</body>
</html>
