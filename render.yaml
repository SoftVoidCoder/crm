previews:
  generation: off

databases:
  - name: korda-postgres
    databaseName: korda
    user: korda

services:
  - type: web
    name: korda-crm
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: KORDA_ENV
        value: production
      - key: KORDA_COOKIE_SECURE
        value: "1"
      - key: KORDA_APP_SECRET
        generateValue: true
      - key: KORDA_DATABASE_URL
        fromDatabase:
          name: korda-postgres
          property: connectionString
      - key: KORDA_DIRECTOR_EMAIL
        sync: false
      - key: KORDA_DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: KORDA_SMTP_USER
        sync: false
      - key: KORDA_SMTP_PASS
        sync: false
      - key: KORDA_SMTP_HOST
        value: smtp.yandex.ru
      - key: KORDA_SMTP_PORT
        value: "465"
      - key: KORDA_DADATA_TOKEN
        sync: false
      - key: KORDA_DADATA_SECRET
        sync: false
